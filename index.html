<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS 2.0</title>

<style>
* {box-sizing:border-box}

body {
  margin:0;
  background:#020712;
  color:#00eaff;
  font-family:monospace;
  text-align:center;
  min-height:100vh;
  padding:25px 15px;
}

h1 {
  margin-top:40px;
  letter-spacing:8px;
  font-size:34px;
  text-shadow:0 0 20px #00eaff;
}

.sub {
  letter-spacing:3px;
  color:#8beeff;
}

.reactor {
  width:230px;
  height:230px;
  margin:65px auto 35px;
  border-radius:50%;
  border:3px solid #00eaff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px #00eaff,
             inset 0 0 30px #00eaff;
  background:radial-gradient(circle,#10283d,#020712 70%);
  transition:0.3s;
}

.reactor.listening {
  animation:pulse 1s infinite alternate;
}

@keyframes pulse {
  from {transform:scale(1);box-shadow:0 0 20px #00eaff}
  to {transform:scale(1.07);box-shadow:0 0 60px #00eaff}
}

.core {
  font-size:65px;
}

button {
  background:#00eaff;
  color:#020712;
  border:0;
  border-radius:12px;
  padding:16px 25px;
  font-size:18px;
  font-weight:bold;
  margin:10px;
}

button:active {transform:scale(.95)}

#status {
  margin:25px auto;
  font-size:18px;
  min-height:50px;
}

#heard {
  color:#9beeff;
  font-size:15px;
}

.footer {
  margin-top:70px;
  font-size:12px;
  color:#526e8b;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
<p class="sub">PERSONAL AI SYSTEM 2.0</p>

<div class="reactor" id="reactor">
  <div class="core">◉</div>
</div>

<button onclick="listen()">🎙️ ACTIVATE</button>
<button onclick="stop()">■ STOP</button>

<p id="status">SYSTEM READY</p>
<p id="heard"></p>

<div class="footer">
JARVIS 2.0 • VOICE SYSTEM
</div>

<script>

function speak(text) {
  speechSynthesis.cancel();
  let s = new SpeechSynthesisUtterance(text);
  s.lang = "en-IN";
  s.rate = 1;
  speechSynthesis.speak(s);
}

function listen() {
  let SR = window.SpeechRecognition ||
           window.webkitSpeechRecognition;

  if (!SR) {
    document.getElementById("status").innerText =
      "Speech recognition unavailable";
    return;
  }

  let rec = new SR();
  rec.lang = "en-IN";
  rec.continuous = false;
  rec.interimResults = false;

  document.getElementById("reactor").classList.add("listening");
  document.getElementById("status").innerText = "LISTENING...";
  document.getElementById("heard").innerText = "";

  rec.onresult = function(e) {
    let c = e.results[0][0].transcript.toLowerCase();
    document.getElementById("heard").innerText = "YOU: " + c;

    let r = "";

    if (c.includes("hello") || c.includes("namaste")) {
      r = "Hello sir. JARVIS 2.0 is ready.";
    }

    else if (c.includes("time") || c.includes("samay")) {
      r = "The time is " + new Date().toLocaleTimeString();
    }

    else if (c.includes("date") || c.includes("tarikh")) {
      r = "Today is " + new Date().toLocaleDateString();
    }

    else if (c.includes("your name") || c.includes("naam")) {
      r = "I am JARVIS version 2.0.";
    }

    else if (c.includes("google")) {
      r = "Opening Google.";
      window.open("https://www.google.com", "_blank");
    }

    else if (c.includes("youtube")) {
      r = "Opening YouTube.";
      window.open("https://www.youtube.com", "_blank");
    }

    else if (c.includes("how are you")) {
      r = "All systems are functioning normally.";
    }

    else {
      r = "Command not recognized. My system is learning.";
    }

    document.getElementById("status").innerText = "JARVIS: " + r;
    speak(r);
  };

  rec.onerror = function(e) {
    document.getElementById("status").innerText =
      "ERROR: " + e.error;
  };

  rec.onend = function() {
    document.getElementById("reactor").classList.remove("listening");
  };

  rec.start();
}

function stop() {
  speechSynthesis.cancel();
  document.getElementById("reactor").classList.remove("listening");
  document.getElementById("status").innerText = "SYSTEM STOPPED";
}

</script>
</body>
</html>
