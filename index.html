 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 3.0</title>

<style>
body {
  background: #050b18;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 30px 15px;
}

h1 {
  letter-spacing: 5px;
  text-shadow: 0 0 20px #00eaff;
}

.reactor {
  width: 170px;
  height: 170px;
  margin: 40px auto;
  border: 5px solid #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 30px #00eaff, inset 0 0 25px #00eaff;
  animation: pulse 2s infinite alternate;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

@keyframes pulse {
  from { transform: scale(.95); box-shadow: 0 0 15px #00eaff; }
  to { transform: scale(1.06); box-shadow: 0 0 45px #00eaff; }
}

button {
  background: transparent;
  color: #00eaff;
  border: 2px solid #00eaff;
  padding: 15px 25px;
  margin: 10px;
  border-radius: 12px;
  font-size: 16px;
}

button:active {
  background: #00eaff;
  color: #050b18;
}

#status {
  color: white;
  margin: 20px;
}

#log {
  color: #b5dfff;
  margin-top: 25px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>JARVIS 3.0</h1>
<p>PERSONAL VOICE ASSISTANT</p>

<div class="reactor">J</div>

<p id="status">SYSTEM READY</p>

<button onclick="listen()">ACTIVATE 🎙️</button>
<button onclick="stopJarvis()">STOP ⏹️</button>

<div id="log">Awaiting command...</div>

<script>
const statusText = document.getElementById("status");
const log = document.getElementById("log");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let listening = false;

function speak(message) {
  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-IN";

  window.speechSynthesis.speak(speech);
}

function listen() {
  if (!SpeechRecognition) {
    statusText.innerText = "Speech recognition unsupported";
    speak("Speech recognition is not supported");
    return;
  }

  if (listening) return;

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    statusText.innerText = "LISTENING...";
  };

  recognition.onresult = (event) => {
    const command = event.results[0][0].transcript.toLowerCase();

    log.innerText = "Command: " + command;
    executeCommand(command);
  };

  recognition.onerror = (event) => {
    statusText.innerText = "ERROR: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    if (statusText.innerText === "LISTENING...") {
      statusText.innerText = "SYSTEM READY";
    }
  };

  recognition.start();
}

function executeCommand(command) {
  statusText.innerText = "PROCESSING...";

  if (command.includes("hello") || command.includes("namaste")) {
    speak("Hello sir. Jarvis 3.0 is online.");
  }

  else if (command.includes("time") || command.includes("samay")) {
    const time = new Date().toLocaleTimeString("en-IN");
    speak("The time is " + time);
  }

  else if (command.includes("date") || command.includes("tarikh")) {
    const date = new Date().toLocaleDateString("en-IN");
    speak("Today's date is " + date);
  }

  else if (command.includes("your name") || command.includes("naam")) {
    speak("I am Jarvis 3.0, your voice assistant.");
  }

  else if (command.includes("youtube") || command.includes("yt kholo")) {
    speak("Opening YouTube");
    window.open("https://www.youtube.com", "_blank");
  }

  else if (command.includes("google")) {
    speak("Opening Google");
    window.open("https://www.google.com", "_blank");
  }

  else if (command.includes("wikipedia")) {
    speak("Opening Wikipedia");
    window.open("https://www.wikipedia.org", "_blank");
  }

  else if (command.includes("search")) {
    const query = command.replace("search", "").trim();

    if (query) {
      speak("Searching Google");
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank"
      );
    } else {
      speak("What should I search?");
    }
  }

  else if (command.includes("how are you")) {
    speak("I am functioning perfectly. Thank you.");
  }

  else if (command.includes("stop")) {
    stopJarvis();
  }

  else {
    speak("Sorry, I do not understand this command yet.");
  }

  statusText.innerText = "SYSTEM READY";
}

function stopJarvis() {
  if (recognition) {
    recognition.abort();
  }

  listening = false;
  window.speechSynthesis.cancel();
  statusText.innerText = "SYSTEM STOPPED";
}
</script>

</body>
</html>
